name: Apply verified v0.2.1 repairs
on:
  push:
    branches: ['v0.2.1']
    paths: ['.github/workflows/apply-v021.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recover and verify reviewed patch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/v0.2.1
          git fetch origin master
          test "$(git rev-parse origin/master)" = 9c3d91f40b17f0a4fbab3bc6eb4271408bd3c8e1
          git diff --quiet origin/master -- . ':!.github/workflows/apply-v021.yml'
          : > "$RUNNER_TEMP/repairs.xz"
          for sha in 6eed2b2721dd25be5f4839988d1b3c0fbc7ba2fc 181fb94945b16d8347ffe84bcbc46da32cea0de3 f222ec63bd4e7864925e6e1fa5bba7cc5131741a 2554cd6cde430e92fc6b85bfba9ef4bba75aaa3c; do
            gh api "repos/Mr-remon219/search-boost/git/blobs/$sha" --jq .content | tr -d '\n' | base64 -d >> "$RUNNER_TEMP/repairs.xz"
          done
          python - <<'PY'
          import os, lzma, hashlib
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP'])
          patch = lzma.decompress((p/'repairs.xz').read_bytes())
          assert hashlib.sha256(patch).hexdigest() == 'bf4260242890c10cbd97cbd17dc391293a711fbd714a70eb74b448c929ffcce1'
          (p/'repairs.patch').write_bytes(patch)
          PY
          git apply --check "$RUNNER_TEMP/repairs.patch"
          git apply --index "$RUNNER_TEMP/repairs.patch"
          git diff --cached --check
      - name: Install exact lockfile and validate repaired package
        run: |
          npm ci --ignore-scripts
          npm ls --all
          npm run test:v021
          npm run prepublishOnly
      - name: Commit only to requested repair branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name '柠檬山上的柠檬精'
          git config user.email '83684151+Mr-remon219@users.noreply.github.com'
          git add README.md README_zh.md adapters docs grok-plugin lib package.json package-lock.json scripts
          git diff --cached --check
          git commit -m 'fix: close user-audit defects across transport, configuration, updates and Jev' -m 'Repair the 18 tracked v0.2.0 findings, add native Vercel Jev evaluation support, isolate transport implementations, protect user files, bound process trees and credential redirects, and document validation boundaries.'
          git push origin HEAD:refs/heads/v0.2.1
          git rev-parse HEAD
