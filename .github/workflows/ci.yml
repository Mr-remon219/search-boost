name: CI

on:
  push:
    # Keep pre-PR feature-branch validation. PR merge refs are a distinct input.
    branches: [master, main, 'Mr-remon219/**', jev]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Never let an untrusted PR head name cancel a protected-branch push.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    # Preserve the three existing required-check names.
    name: test (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22.13.0'
            label: ubuntu-latest
            primary: true
          - os: windows-latest
            node: '22'
            label: windows-latest
            primary: false
          - os: macos-latest
            node: '22'
            label: macos-latest
            primary: false
          - os: ubuntu-latest
            node: '24'
            label: ubuntu-latest, Node 24
            primary: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Independent TOML parser for Codex config/print assertions.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Syntax and CI policy (once, on the declared Node floor)
        if: matrix.primary
        run: |
          npm run check
          npm run check:ci

      - name: Validate all GitHub workflows with actionlint
        if: matrix.primary
        run: |
          mkdir -p "$RUNNER_TEMP/actionlint"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 2 \
            --output "$RUNNER_TEMP/actionlint/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' \
            "$RUNNER_TEMP/actionlint/actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/actionlint/actionlint.tar.gz" -C "$RUNNER_TEMP/actionlint" actionlint
          "$RUNNER_TEMP/actionlint/actionlint" -color -shellcheck='' -pyflakes=''

      - name: Audit the exact dependency lock (once, no credential inheritance)
        if: matrix.primary
        run: |
          mkdir -p "$RUNNER_TEMP/ci-logs"
          npm run audit:dependencies 2>&1 | tee "$RUNNER_TEMP/ci-logs/dependencies.log"

      # The runner aggregates failures and continues through every entry. Do not
      # precede this with the same named suites; do not regenerate source assets.
      - name: All regressions under a poisoned caller environment
        id: regressions
        run: |
          mkdir -p "$RUNNER_TEMP/ci-logs"
          npm run test:isolation 2>&1 | tee "$RUNNER_TEMP/ci-logs/isolation.log"

      - name: Upload failure diagnostics
        if: failure() && !cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-logs-${{ matrix.os }}-node-${{ matrix.node }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-logs/*.log
          retention-days: 7
          if-no-files-found: ignore

      # Snapshot only a provisioned, tested primary tree; no HOME, npmrc, env or
      # Git checkout credentials. This is evidence, never a release artifact.
      - name: Prepare offline audit snapshot
        if: always() && !cancelled() && matrix.primary && steps.regressions.outcome != 'skipped'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/search-boost-audit"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/search-boost-audit"
          cp -a node_modules "$RUNNER_TEMP/search-boost-audit/"
          tar -czf "$RUNNER_TEMP/search-boost-audit.tar.gz" -C "$RUNNER_TEMP/search-boost-audit" .

      - name: Upload offline audit snapshot
        if: always() && !cancelled() && matrix.primary && steps.regressions.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: search-boost-audit-${{ github.sha }}
          path: ${{ runner.temp }}/search-boost-audit.tar.gz
          retention-days: 3
          if-no-files-found: error
