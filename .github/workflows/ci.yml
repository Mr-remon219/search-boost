name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run plugin:sync-grok
      - run: npm run check
      - run: npm run test:install
      - run: npm run test:doctor
      - name: Doctor CLI smoke
        run: |
          if grep -q 'runDoctor' lib/cli/commands.mjs; then
            set +e
            node cli.mjs doctor --quick --json
            ec=$?
            set -e
            if [ "$ec" -eq 2 ]; then exit 0; fi
            exit "$ec"
          fi
      - run: npm run test:fusion
      - run: npm run smoke
