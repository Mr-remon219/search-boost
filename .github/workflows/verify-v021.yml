name: v0.2.1 online user acceptance
on:
  push:
    branches: ['v0.2.1']
    paths: ['.github/workflows/verify-v021.yml']
permissions:
  contents: read
jobs:
  user-session:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked runtime and isolated host fetch version
        run: |
          npm ci --ignore-scripts
          npm install --prefix "$RUNNER_TEMP/host" --ignore-scripts --no-audit --save-exact undici@8.10.2
          mkdir -p "$RUNNER_TEMP/v021-evidence"
          git status --porcelain > "$RUNNER_TEMP/v021-evidence/source-before.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/v021-evidence/commit.txt"
      - name: Create ephemeral credential recipient
        run: |
          umask 077
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$RUNNER_TEMP/private.pem" 2>/dev/null
          openssl pkey -in "$RUNNER_TEMP/private.pem" -pubout -out "$RUNNER_TEMP/public.pem"
      - uses: actions/upload-artifact@v4
        with:
          name: v021-session-public-key
          path: ${{ runner.temp }}/public.pem
          retention-days: 1
      - name: Receive encrypted credential
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 120); do
            if curl --silent --fail -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github.raw+json' "https://api.github.com/repos/Mr-remon219/search-boost/contents/audit/v021-envelope.json?ref=v0.2.1&nonce=$i" -o "$RUNNER_TEMP/envelope.json"; then exit 0; fi
            sleep 3
          done
          exit 1
      - name: Operate original CLI MCP and Pi adapter
        env:
          PRIVATE_KEY_FILE: ${{ runner.temp }}/private.pem
          ENVELOPE_FILE: ${{ runner.temp }}/envelope.json
          HOST_UNDICI: ${{ runner.temp }}/host/node_modules/undici
        run: node audit/v021-session.mjs
      - name: Record integrity and destroy temporary credentials
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/v021-evidence"
          git status --porcelain > "$RUNNER_TEMP/v021-evidence/source-after.txt"
          git diff --stat > "$RUNNER_TEMP/v021-evidence/source-diff.txt"
          rm -f "$RUNNER_TEMP/private.pem" "$RUNNER_TEMP/envelope.json"
          rm -rf "$RUNNER_TEMP/v021-home"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v021-online-user-evidence
          path: ${{ runner.temp }}/v021-evidence/
          retention-days: 7
