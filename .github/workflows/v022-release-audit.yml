name: v0.2.2 audited repair tree

on:
  push:
    branches: [Mr-remon219/v0.2.2]
    paths: [.github/workflows/v022-release-audit.yml]

# One-shot bridge for the offline audit environment. This job only stores Git
# objects after testing them. It NEVER updates refs, merges, or publishes npm.
# The resulting tree removes this workflow; a separately reviewed connector
# write must fast-forward the exact parent before the normal PR CI can run.
permissions:
  contents: write

jobs:
  audit:
    if: github.repository == 'Mr-remon219/search-boost' && github.ref == 'refs/heads/Mr-remon219/v0.2.2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply the checksum-pinned local audit patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, subprocess, urllib.request
          from pathlib import Path
          parent = subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip()
          assert parent == '19f47ae05f4c4c58c4417785d13edffe3c16c124', 'Audit baseline changed; review instead of overwriting'
          request = urllib.request.Request('https://api.github.com/repos/Mr-remon219/search-boost/git/blobs/172c3e8e511a161bdcbf7cb968ec889a662cd80b', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(request, timeout=30) as response:
              blob = json.load(response)
          patch = base64.b64decode(blob['content']).decode('utf-8')
          # Restore a transcribed context line; the immutable checksum below
          # verifies the complete patch, not just the changed code lines.
          patch = patch.replace('支持 focused contextual paragraph extraction.', '支持 `focus` 关键词段落提炼，具备内存缓存与大体积熔断保护。')
          raw = patch.encode('utf-8')
          assert hashlib.sha256(raw).hexdigest() == '6ef308be8e3917de93d43bf92d5354acdca7e1b13b4845bad8a8d2b925209b12', 'Patch checksum mismatch'
          file = Path(os.environ['RUNNER_TEMP']) / 'v022-release-fixes.patch'
          file.write_bytes(raw)
          subprocess.run(['git', 'apply', '--check', str(file)], check=True)
          subprocess.run(['git', 'apply', str(file)], check=True)
          Path('.github/workflows/v022-release-audit.yml').unlink()
          expected = {
            'README.md': 'b2ce3cd0ba020c41a7029a36e269ba8750be0590',
            'README_zh.md': '7a6d0ebdc57a7b0835efa2dd2b9be127ce4c92a5',
            'docs/v0.2.2-release.md': '68427115dce258644cf4f42abe86709cb0a865a6',
            'grok-plugin/plugin.json': '358d0167c033f29bda66150153dd3af0a3025b8b',
            'lib/runtime.mjs': 'd094428655af3815f86b5666470a6b42d80de581',
            'lib/search/adaptive/pages.js': '0b2b9f295a609944bd7c58fe3fe78fd384dbb94f',
            'lib/search/adaptive/prompts.js': 'fe99a6880ca95f76b793d9e89c8360041ba60a8b',
            'lib/search/adaptive/temporal.js': '5e0450690882214ad76c453b8b79f6ecf28dbd1b',
            'package-lock.json': 'bdfc89fcb36b5c8c1f354a58790be729ce80cb1f',
            'package.json': '0025e12d1dd6d7402c3a7afc17d855eb4785fd11',
            'scripts/test-adaptive-search.mjs': '0f538119c1f95edf4dce036850190456a82c5f18'
          }
          for path, sha in expected.items():
              assert subprocess.check_output(['git', 'hash-object', path], text=True).strip() == sha, path
          (Path(os.environ['RUNNER_TEMP']) / 'v022-expected.json').write_text(json.dumps(expected))
          PY
      - run: npm ci
      - name: Full release gate
        run: npm run prepublishOnly
      - name: Validate distributable
        run: |
          git diff --check
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/v022-pack.json"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'
          const [pack] = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/v022-pack.json', 'utf8'))
          assert.equal(pack.version, '0.2.2')
          for (const file of pack.files) assert.ok(!/^(?:node_modules|\.github|\.git)\//.test(file.path), file.path)
          for (const path of ['lib/search/adaptive/pages.js', 'lib/search/adaptive/temporal.js', 'docs/v0.2.2-release.md', 'adapters/mcp/schemas.mjs', 'adapters/pi/index.js', 'adapters/dsh/index.js']) assert.ok(pack.files.some((f) => f.path === path), path)
          console.log('PACK_OK', pack.entryCount, pack.size)
          JS
      - name: Store the exact audited tree without moving any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import { readFileSync, writeFileSync } from 'node:fs'
          import { execFileSync } from 'node:child_process'
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim()
          const expected = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/v022-expected.json', 'utf8'))
          const removed = '.github/workflows/v022-release-audit.yml'
          git('add', '--all')
          const changed = git('diff', '--cached', '--name-only').split('\n').sort()
          assert.deepEqual(changed, [...Object.keys(expected), removed].sort())
          for (const [path, sha] of Object.entries(expected)) assert.equal(git('hash-object', path), sha, path)
          const api = async (path, body) => {
            const response = await fetch('https://api.github.com/repos/Mr-remon219/search-boost' + path, { method: 'POST', headers: { authorization: 'Bearer ' + process.env.GH_TOKEN, accept: 'application/vnd.github+json', 'content-type': 'application/json' }, body: JSON.stringify(body), signal: AbortSignal.timeout(30000) })
            if (!response.ok) throw new Error('Git object storage failed: HTTP ' + response.status)
            return response.json()
          }
          const tree = []
          for (const [path, expectedSha] of Object.entries(expected)) {
            const blob = await api('/git/blobs', { content: readFileSync(path).toString('base64'), encoding: 'base64' })
            assert.equal(blob.sha, expectedSha)
            tree.push({ path, mode: '100644', type: 'blob', sha: blob.sha })
          }
          tree.push({ path: removed, mode: '100644', type: 'blob', sha: null })
          const result = await api('/git/trees', { base_tree: git('rev-parse', 'HEAD^{tree}'), tree })
          const report = { parent: git('rev-parse', 'HEAD'), tree: result.sha, files: expected, removed, releaseGate: 'passed', packageCheck: 'passed', npmPublished: false }
          writeFileSync(process.env.RUNNER_TEMP + '/v022-tree.json', JSON.stringify(report, null, 2))
          console.log('AUDITED_TREE_SHA=' + result.sha)
          console.log('AUDITED_PARENT_SHA=' + report.parent)
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: v022-release-audit-${{ github.sha }}
          path: |
            ${{ runner.temp }}/v022-tree.json
            ${{ runner.temp }}/v022-pack.json
            ${{ runner.temp }}/search-boost-0.2.2.tgz
          retention-days: 3
          if-no-files-found: error
